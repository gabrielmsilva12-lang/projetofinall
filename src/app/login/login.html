<main class="login-page">

  <div class="login-card">

    <div class="login-header">

      <span class="tag">
        ELDERENGLISH
      </span>

      <h1>
        Entrar
      </h1>

      <p>
        Entre na sua conta para acessar todo o conteúdo.
      </p>

    </div>


    <form (ngSubmit)="entrar()">

      <!-- E-MAIL -->

      <div class="form-group">

        <label for="email">
          E-mail
        </label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Digite seu e-mail"
        >

      </div>


      <!-- SENHA -->

      <div class="form-group">

        <label for="senha">
          Senha
        </label>

        <input
          id="senha"
          type="password"
          name="senha"
          [(ngModel)]="senha"
          placeholder="Digite sua senha"
        >

      </div>


      <!-- BOTÃO -->

      <button type="submit">
        Entrar
      </button>


      <!-- MENSAGEM -->

      <p
        class="mensagem"
        [class.erro]="tipoMensagem === 'erro'"
        [class.sucesso]="tipoMensagem === 'sucesso'"
        *ngIf="mensagem"
      >
        {{ mensagem }}
      </p>

    </form>


    <!-- CADASTRO -->

    <div class="cadastro-link">

      <p>
        Ainda não possui uma conta?
      </p>

      <a routerLink="/register">
        Criar uma conta
      </a>

    </div>


    <!-- VOLTAR -->

    <div class="voltar">

      <a routerLink="/">
        ← Voltar para o início
      </a>

    </div>

  </div>

</main>
